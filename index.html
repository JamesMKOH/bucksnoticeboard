<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provincial Noticeboard — Buckinghamshire Freemasons</title>
<meta name="description" content="Buckinghamshire Freemasons noticeboard — lodge vacancies, Provincial news and events.">

<!-- PWA / iOS home screen -->
<meta name="theme-color" content="#09599E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bucks Noticeboard">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --red:#E11C23;
  --blue:#09599E;
  --blue-deep:#074478;
  --gold:#FBD60C;
  --black:#0D0D0E;
  --paper:#F7F8FA;
  --card:#FFFFFF;
  --ink:#0D0D0E;
  --ink-soft:#5C6270;
  --line:#E3E6EB;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}

/* ---------- Header ---------- */
header{
  background:var(--card);
  color:var(--ink);
  padding:calc(1.3rem + env(safe-area-inset-top)) 1.2rem 1.2rem;
  position:relative;
}
/* red/blue split bar - echo of the roundel */
header::after{
  content:"";display:block;position:absolute;left:0;right:0;bottom:0;height:5px;
  background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50% 100%);
}
.masthead{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:1.1rem}
#crest{height:78px;width:78px;display:none;flex-shrink:0}
#crest.show{display:block}
.masthead-text{flex:1;min-width:0}
.eyebrow{
  font-family:'Marcellus',serif;
  letter-spacing:.32em;
  text-transform:uppercase;
  font-size:.68rem;
  color:var(--red);
}
h1{
  font-family:'Marcellus',serif;
  font-weight:400;
  font-size:clamp(1.5rem,4.5vw,2.2rem);
  line-height:1.15;
  margin-top:.15rem;
  color:var(--blue-deep);
}
.header-meta{
  max-width:1060px;margin:.8rem auto 0;
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  font-size:.82rem;color:var(--ink-soft);
}
#updated{font-style:italic}
#refreshBtn{
  display:inline-flex;align-items:center;gap:.4rem;
  background:transparent;border:1px solid var(--blue);
  color:var(--blue);font:inherit;font-size:.8rem;font-weight:600;
  padding:.35rem .8rem;border-radius:999px;cursor:pointer;
  transition:background .15s,color .15s;
}
#refreshBtn:hover{background:var(--blue);color:#fff}
#refreshBtn svg{width:14px;height:14px}
#refreshBtn.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Toolbar ---------- */
.toolbar{
  max-width:1060px;margin:1.1rem auto 0;padding:0 1.2rem;
  display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;
}
.toolbar input[type="search"]{
  flex:1 1 220px;
  font:inherit;font-size:.95rem;
  padding:.55rem .9rem;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:var(--ink);
}
.toolbar select{
  font:inherit;font-size:.9rem;
  padding:.55rem .7rem;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:var(--ink);
}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{
  font:inherit;font-size:.82rem;font-weight:600;
  padding:.4rem .85rem;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  transition:all .15s;
}
.chip[aria-pressed="true"]{
  background:var(--blue);border-color:var(--blue);color:#fff;
}
input:focus-visible,select:focus-visible,button:focus-visible,.card:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px;
}

/* ---------- Banner / status ---------- */
.banner{
  max-width:1060px;margin:1rem auto 0;padding:.7rem 1rem;
  margin-left:max(1.2rem,calc((100% - 1060px)/2));
  margin-right:max(1.2rem,calc((100% - 1060px)/2));
  border-radius:var(--radius);
  font-size:.88rem;
  display:none;
}
.banner.show{display:block}
.banner.warn{background:#FEF8DC;border:1px solid var(--gold);color:#6b5a04}
.banner.error{background:#FCE9EA;border:1px solid var(--red);color:var(--red)}
#countLine{
  max-width:1060px;margin:1.1rem auto .2rem;padding:0 1.2rem;
  font-size:.85rem;color:var(--ink-soft);
}

/* ---------- Cards ---------- */
.grid{
  max-width:1060px;margin:0 auto;padding:.6rem 1.2rem 3rem;
  display:grid;gap:1rem;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-top:3px solid var(--red);
  border-radius:var(--radius);
  padding:1.1rem 1.2rem 1rem;
  cursor:pointer;
  transition:box-shadow .15s,transform .15s;
  position:relative;
}
.card:hover{box-shadow:0 4px 16px rgba(9,89,158,.14);transform:translateY(-1px)}
.card-top{display:flex;align-items:flex-start;gap:.8rem}
.role{
  font-family:'Marcellus',serif;
  font-size:1.22rem;color:var(--blue-deep);
  line-height:1.2;flex:1;
}
.roundel{
  flex-shrink:0;
  min-width:46px;height:46px;padding:0 6px;
  border:2px solid var(--gold);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--blue-deep);background:#FFFDF0;
}
.roundel .no{font-family:'Marcellus',serif;font-size:.85rem;line-height:1}
.roundel .lbl{font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.lodge{font-weight:700;font-size:.97rem;margin-top:.55rem;color:var(--red)}
.meta{font-size:.85rem;color:var(--ink-soft);margin-top:.25rem;line-height:1.45}
.badges{display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap}
.badge{
  font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:.22rem .6rem;border-radius:4px;
}
.badge.type{background:#E7F0F9;color:var(--blue-deep)}
.badge.urg-high{background:var(--red);color:#fff}
.badge.urg-medium{background:var(--gold);color:#4a3f02}
.badge.urg-low{background:#EDEEF1;color:var(--ink-soft)}
.card-body{
  max-height:0;overflow:hidden;
  transition:max-height .25s ease;
}
.card.open .card-body{max-height:600px}
.desc{font-size:.92rem;line-height:1.55;margin-top:.85rem;color:var(--ink)}
.contact{
  margin-top:.85rem;padding:.7rem .85rem;
  background:var(--paper);border-left:3px solid var(--gold);
  border-radius:0 6px 6px 0;
  font-size:.9rem;line-height:1.5;
}
.contact .who{font-weight:700;color:var(--blue-deep)}
.contact a{color:var(--red);word-break:break-all}
.expand-hint{
  margin-top:.7rem;font-size:.75rem;color:var(--ink-soft);
  display:flex;align-items:center;gap:.3rem;
}
.expand-hint svg{width:12px;height:12px;transition:transform .2s}
.card.open .expand-hint svg{transform:rotate(180deg)}
.empty{
  grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--ink-soft);
}
.empty .big{font-family:'Marcellus',serif;font-size:1.3rem;color:var(--blue-deep);margin-bottom:.4rem}

/* ---------- Tabs ---------- */
.tabs{
  position:sticky;top:0;z-index:10;
  background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;justify-content:safe center;gap:.2rem;
  padding:0 .6rem;
  box-shadow:0 2px 8px rgba(13,13,14,.04);
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font:inherit;font-size:.95rem;font-weight:600;
  background:none;border:none;cursor:pointer;
  color:var(--ink-soft);
  padding:.85rem 1.1rem .7rem;
  border-bottom:3px solid transparent;
  display:inline-flex;align-items:center;gap:.45rem;
  transition:color .15s,border-color .15s;
  white-space:nowrap;flex-shrink:0;
}
.tab:hover{color:var(--blue)}
.tab[aria-selected="true"]{color:var(--blue-deep);border-bottom-color:var(--red)}
.tcount{
  font-size:.68rem;font-weight:700;
  background:#EDEEF1;color:var(--ink-soft);
  border-radius:999px;padding:.1rem .45rem;min-width:1.3em;text-align:center;
}
.tab[aria-selected="true"] .tcount{background:var(--blue);color:#fff}
.panel[hidden]{display:none}

/* ---------- News ---------- */
.list{
  max-width:760px;margin:0 auto;padding:1.2rem 1.2rem 3rem;
  display:flex;flex-direction:column;gap:1rem;
}
.news-card{
  background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--blue);
  border-radius:var(--radius);padding:1.1rem 1.2rem;
}
.news-date{
  font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--red);
}
.news-title{font-family:'Marcellus',serif;font-size:1.18rem;color:var(--blue-deep);margin-top:.2rem;line-height:1.25}
.news-body{font-size:.93rem;line-height:1.55;margin-top:.5rem}
.news-link{display:inline-block;margin-top:.6rem;font-size:.88rem;font-weight:600;color:var(--red);text-decoration:none}
.news-link:hover{text-decoration:underline}

/* ---------- Events ---------- */
.event-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:1.1rem 1.2rem;
  display:flex;gap:1rem;align-items:flex-start;
}
.date-block{
  flex-shrink:0;width:64px;
  background:var(--blue);color:#fff;border-radius:8px;
  text-align:center;padding:.5rem 0 .45rem;
}
.date-block .d{font-family:'Marcellus',serif;font-size:1.5rem;line-height:1}
.date-block .m{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:.15rem;color:var(--gold)}
.event-main{flex:1;min-width:0}
.event-title{font-family:'Marcellus',serif;font-size:1.18rem;color:var(--blue-deep);line-height:1.25}
.event-meta{font-size:.85rem;color:var(--ink-soft);margin-top:.25rem;line-height:1.45}
.event-when{font-weight:600;color:var(--red)}
.event-desc{font-size:.92rem;line-height:1.55;margin-top:.5rem}
.book-btn{
  display:inline-block;margin-top:.75rem;
  background:var(--red);color:#fff;text-decoration:none;
  font-size:.88rem;font-weight:700;
  padding:.5rem 1.1rem;border-radius:999px;
  transition:background .15s;
}
.book-btn:hover{background:#b8151b}
@media (max-width:520px){
  .tab{padding:.85rem .7rem .7rem;font-size:.85rem}
}

footer{
  text-align:center;padding:1.5rem 1rem 2.5rem;
  font-size:.78rem;color:var(--ink-soft);
  border-top:1px solid var(--line);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="masthead">
    <img id="crest" alt="Buckinghamshire Freemasons crest">
    <div class="masthead-text">
      <div class="eyebrow">Buckinghamshire Freemasons</div>
      <h1>Provincial Noticeboard</h1>
    </div>
  </div>
  <div class="header-meta">
    <span id="updated">Loading listings…</span>
    <button id="refreshBtn" type="button" aria-label="Refresh listings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      Refresh
    </button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="vacancies" aria-selected="true">Vacancies <span class="tcount" id="countVac">–</span></button>
  <button class="tab" role="tab" data-tab="news" aria-selected="false">News <span class="tcount" id="countNews">–</span></button>
  <button class="tab" role="tab" data-tab="prov-events" aria-selected="false">Provincial Events <span class="tcount" id="countEvP">–</span></button>
  <button class="tab" role="tab" data-tab="comm-events" aria-selected="false">Community Events <span class="tcount" id="countEvC">–</span></button>
</nav>

<div id="banner" class="banner" role="status"></div>

<section id="panel-vacancies" class="panel">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search role, lodge or venue…" aria-label="Search vacancies">
    <select id="roleFilter" aria-label="Filter by role">
      <option value="">All roles</option>
    </select>
    <div class="chips" role="group" aria-label="Filter by vacancy type">
      <button class="chip" data-type="" aria-pressed="true">All</button>
      <button class="chip" data-type="joining member" aria-pressed="false">Joining Member</button>
      <button class="chip" data-type="permanent guest" aria-pressed="false">Permanent Guest</button>
    </div>
  </div>
  <p id="countLine"></p>
  <main class="grid" id="grid"></main>
</section>

<section id="panel-news" class="panel" hidden>
  <div class="list" id="newsList"></div>
</section>

<section id="panel-prov-events" class="panel" hidden>
  <div class="list" id="provEventsList"></div>
</section>

<section id="panel-comm-events" class="panel" hidden>
  <div class="list" id="commEventsList"></div>
</section>

<footer>
  Vacancies, news and events are maintained centrally. To list a vacancy for your lodge, contact your Lodge VO, XO or APGM Group Head.
</footer>

const state = { rows: [], news: [], provEvents: [], commEvents: [], updated: "", search: "", role: "", type: "", lastFetch: 0 };
const $ = id => document.getElementById(id);

if (CONFIG.CREST_BASE64) {
  const c = $("crest");
  c.src = CONFIG.CREST_BASE64;
  c.classList.add("show");
}

function showBanner(msg, kind) {
  const b = $("banner");
  b.textContent = msg;
  b.className = "banner show " + kind;
}
function hideBanner() { $("banner").className = "banner"; }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, m =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function contactHtml(details) {
  const d = String(details ?? "").trim();
  if (!d) return "";
  if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d)) return `<a href="mailto:${esc(d)}">${esc(d)}</a>`;
  if (/^[\d\s+()-]{7,}$/.test(d)) return `<a href="tel:${esc(d.replace(/[\s()-]/g,""))}">${esc(d)}</a>`;
  return esc(d);
}

async function loadData(isManual) {
  const btn = $("refreshBtn");
  btn.classList.add("spinning");
  try {
    if (CONFIG.DATA_URL.startsWith("http")) {
      const res = await fetch(CONFIG.DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const buf = await res.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const sheet = wb.Sheets["Vacancies"] || wb.Sheets[wb.SheetNames[0]];
      state.rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      state.news = wb.Sheets["News"] ? XLSX.utils.sheet_to_json(wb.Sheets["News"], { defval: "" }) : [];
      state.provEvents = wb.Sheets["Provincial Events"] ? XLSX.utils.sheet_to_json(wb.Sheets["Provincial Events"], { defval: "" })
                       : wb.Sheets["Events"] ? XLSX.utils.sheet_to_json(wb.Sheets["Events"], { defval: "" }) : [];
      state.commEvents = wb.Sheets["Community Events"] ? XLSX.utils.sheet_to_json(wb.Sheets["Community Events"], { defval: "" }) : [];
      const meta = wb.Sheets["Meta"];
      state.updated = meta && meta["B1"] ? String(meta["B1"].w || meta["B1"].v) : "";
      hideBanner();
    } else {
      state.rows = SAMPLE_ROWS;
      state.news = SAMPLE_NEWS;
      state.provEvents = SAMPLE_EVENTS_PROV;
      state.commEvents = SAMPLE_EVENTS_COMM;
      state.updated = "sample data";
      showBanner("Showing built-in sample listings — set DATA_URL in index.html to your GitHub raw file to go live.", "warn");
    }
    state.lastFetch = Date.now();
    $("updated").textContent = state.updated
      ? "Listings updated: " + state.updated
      : "Listings loaded";
    buildRoleFilter();
    renderAll();
  } catch (err) {
    console.error(err);
    if (state.rows.length === 0) {
      showBanner("Couldn't load the listings — check your connection and try Refresh.", "error");
      $("updated").textContent = "Listings unavailable";
    } else if (isManual) {
      showBanner("Couldn't refresh just now — showing the last loaded listings.", "warn");
    }
  } finally {
    btn.classList.remove("spinning");
  }
}

function openRows() {
  return state.rows.filter(r => String(r["Status"] ?? "").trim().toLowerCase() === "open");
}

function buildRoleFilter() {
  const roles = [...new Set(openRows().map(r => String(r["Role"] ?? "").trim()).filter(Boolean))].sort();
  const sel = $("roleFilter");
  const current = sel.value;
  sel.innerHTML = '<option value="">All roles</option>' +
    roles.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
  if (roles.includes(current)) sel.value = current;
}

function render() {
  const q = state.search.toLowerCase();
  let rows = openRows().filter(r => {
    if (state.role && String(r["Role"]).trim() !== state.role) return false;
    if (state.type) {
      const t = String(r["Vacancy Type"] ?? "").trim().toLowerCase();
      if (t !== state.type && t !== "either") return false;
    }
    if (q) {
      const hay = ["Lodge Name","Role","Venue","Description","Meeting Nights"]
        .map(k => String(r[k] ?? "")).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  rows.sort((a, b) => {
    const ua = URG_RANK[String(a["Urgency"]).trim().toLowerCase()] ?? 3;
    const ub = URG_RANK[String(b["Urgency"]).trim().toLowerCase()] ?? 3;
    return ua - ub || String(a["Lodge Name"]).localeCompare(String(b["Lodge Name"]));
  });

  const total = openRows().length;
  $("countLine").textContent = rows.length === total
    ? `${total} open ${total === 1 ? "vacancy" : "vacancies"}`
    : `Showing ${rows.length} of ${total} open vacancies`;

  const grid = $("grid");
  if (rows.length === 0) {
    grid.innerHTML = `<div class="empty">
      <div class="big">No vacancies match</div>
      <div>Try clearing the search or filters — or check back soon, listings change regularly.</div>
    </div>`;
    return;
  }

  grid.innerHTML = rows.map((r, i) => {
    const urg = String(r["Urgency"] ?? "").trim().toLowerCase();
    const urgClass = urg === "high" ? "urg-high" : urg === "medium" ? "urg-medium" : "urg-low";
    const no = String(r["Lodge No"] ?? "").trim();
    return `
    <article class="card" tabindex="0" role="button" aria-expanded="false" data-i="${i}">
      <div class="card-top">
        <h2 class="role">${esc(r["Role"])}</h2>
        ${no ? `<div class="roundel"><span class="lbl">No.</span><span class="no">${esc(no)}</span></div>` : ""}
      </div>
      <div class="lodge">${esc(r["Lodge Name"])}</div>
      <div class="meta">${esc(r["Venue"])}${r["Meeting Nights"] ? " · " + esc(r["Meeting Nights"]) : ""}</div>
      <div class="badges">
        <span class="badge type">${esc(r["Vacancy Type"])}</span>
        ${urg ? `<span class="badge ${urgClass}">${esc(r["Urgency"])}</span>` : ""}
      </div>
      <div class="card-body">
        ${r["Description"] ? `<p class="desc">${esc(r["Description"])}</p>` : ""}
        <div class="contact">
          <span class="who">${esc(r["Contact Name"] || "Contact")}</span><br>
          ${contactHtml(r["Contact Details"])}
        </div>
      </div>
      <div class="expand-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        <span>Details &amp; contact</span>
      </div>
    </article>`;
  }).join("");

  grid.querySelectorAll(".card").forEach(card => {
    const toggle = e => {
      if (e.target.closest("a")) return;
      card.classList.toggle("open");
      card.setAttribute("aria-expanded", card.classList.contains("open"));
    };
    card.addEventListener("click", toggle);
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(e); }
    });
  });
}

/* ---------- News & Events ---------- */
const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function parseDate(v) {
  if (v instanceof Date && !isNaN(v)) return v;
  const s = String(v ?? "").trim();
  if (!s) return null;
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);   // dd/mm/yyyy
  if (m) {
    let y = +m[3]; if (y < 100) y += 2000;
    const d = new Date(y, +m[2] - 1, +m[1]);
    return isNaN(d) ? null : d;
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);                     // yyyy-mm-dd
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  const d = new Date(s);                                            // "12 September 2026" etc.
  return isNaN(d) ? null : d;
}

function fmtDate(d) {
  return d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";
}

function relDays(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((d - today) / 86400000);
  if (days === 0) return "Today";
  if (days === 1) return "Tomorrow";
  if (days < 7) return `In ${days} days`;
  const w = Math.round(days / 7);
  return w === 1 ? "In 1 week" : `In ${w} weeks`;
}

function isShown(r) {
  return String(r["Show"] ?? "").trim().toLowerCase() !== "no";
}

function safeLink(url) {
  const u = String(url ?? "").trim();
  return /^https?:\/\//i.test(u) ? u : "";
}

function renderNews() {
  const items = state.news.filter(isShown)
    .map(r => ({ ...r, _d: parseDate(r["Date"]) }))
    .sort((a, b) => (b._d?.getTime() ?? -Infinity) - (a._d?.getTime() ?? -Infinity));
  const el = $("newsList");
  if (items.length === 0) {
    el.innerHTML = `<div class="empty"><div class="big">No news just now</div><div>Check back soon.</div></div>`;
    return items.length;
  }
  el.innerHTML = items.map(r => {
    const link = safeLink(r["Link"]);
    return `
    <article class="news-card">
      ${r._d ? `<div class="news-date">${esc(fmtDate(r._d))}</div>` : ""}
      <h2 class="news-title">${esc(r["Title"])}</h2>
      ${r["Body"] ? `<p class="news-body">${esc(r["Body"])}</p>` : ""}
      ${link ? `<a class="news-link" href="${esc(link)}" target="_blank" rel="noopener">Read more →</a>` : ""}
    </article>`;
  }).join("");
  return items.length;
}

function renderEvents(rows, listId) {
  const today = new Date(); today.setHours(0,0,0,0);
  const items = rows.filter(isShown)
    .map(r => ({ ...r, _d: parseDate(r["Date"]) }))
    .filter(r => !r._d || r._d >= today)             // hide past events; keep undated
    .sort((a, b) => (a._d?.getTime() ?? Infinity) - (b._d?.getTime() ?? Infinity));
  const el = $(listId);
  if (items.length === 0) {
    el.innerHTML = `<div class="empty"><div class="big">No upcoming events</div><div>Check back soon — new events are added regularly.</div></div>`;
    return items.length;
  }
  el.innerHTML = items.map(r => {
    const link = safeLink(r["Booking Link"]);
    const d = r._d;
    return `
    <article class="event-card">
      ${d ? `<div class="date-block"><div class="d">${d.getDate()}</div><div class="m">${MONTHS_SHORT[d.getMonth()]}</div></div>` : ""}
      <div class="event-main">
        <h2 class="event-title">${esc(r["Title"])}</h2>
        <div class="event-meta">
          ${d ? `<span class="event-when">${esc(fmtDate(d))} · ${esc(relDays(d))}</span><br>` : ""}
          ${esc(r["Venue"] ?? "")}
        </div>
        ${r["Description"] ? `<p class="event-desc">${esc(r["Description"])}</p>` : ""}
        ${link ? `<a class="book-btn" href="${esc(link)}" target="_blank" rel="noopener">Book now</a>` : ""}
      </div>
    </article>`;
  }).join("");
  return items.length;
}

function renderAll() {
  render();
  $("countVac").textContent = openRows().length;
  $("countNews").textContent = renderNews();
  $("countEvP").textContent = renderEvents(state.provEvents, "provEventsList");
  $("countEvC").textContent = renderEvents(state.commEvents, "commEventsList");
}

/* ---------- Tabs ---------- */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", "false"));
    tab.setAttribute("aria-selected", "true");
    ["vacancies", "news", "prov-events", "comm-events"].forEach(p => {
      document.getElementById("panel-" + p).hidden = (p !== tab.dataset.tab);
    });
    window.scrollTo({ top: 0 });
  });
});

$("search").addEventListener("input", e => { state.search = e.target.value.trim(); render(); });
$("roleFilter").addEventListener("change", e => { state.role = e.target.value; render(); });
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
    chip.setAttribute("aria-pressed", "true");
    state.type = chip.dataset.type;
    render();
  });
});
$("refreshBtn").addEventListener("click", () => loadData(true));

/* Refetch when the PWA comes back to the foreground and data is >60s old */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - state.lastFetch > 60000) {
    loadData(false);
  }
});

loadData(false);
</script>
</body>
